<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klimawerkstatt Quizshow – Punktestand</title>
<style>
:root{
  --ink:#0E1116; --panel:#171C24; --panel-2:#1F2630; --line:#2C3542;
  --fg:#E9EEF4; --muted:#8B98A9;
  --t1:#E4352A; --t2:#2E7DD1; --t3:#3AA85C; --t4:#EFB211;
  --display:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--fg);font-family:var(--body);
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.brand b{color:var(--fg);font-weight:600}
.btn{
  padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);
  font-size:14px;letter-spacing:.02em;transition:border-color .15s,background .15s;
}
.btn:hover{border-color:#46525f;background:#252d38}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{border-color:#4d7c4d;background:#1d2d1f;color:#9fd8a6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5a6472;margin-right:7px;vertical-align:middle}
.dot.live{background:#3AA85C;box-shadow:0 0 0 3px rgba(58,168,92,.18)}

.board{flex:1 1 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line);min-height:0}
.team{
  position:relative;background:var(--panel);display:flex;flex-direction:column;
  overflow:hidden;transition:background .18s,opacity .18s;
}
.team .head{
  height:9px;flex:0 0 auto;background:var(--c);
}
.team .name{
  font-family:var(--display);font-size:clamp(15px,1.9vw,26px);letter-spacing:.16em;
  text-transform:uppercase;text-align:center;padding:14px 8px 0;color:var(--c);
  transition:color .18s;white-space:nowrap;
}
.team .score{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;
  font-size:clamp(72px,13vw,190px);line-height:.82;letter-spacing:-.02em;
}
.team .pts{
  display:flex;gap:2px;padding:0 10px 10px;flex:0 0 auto;
}
.team .pts button{
  flex:1;padding:12px 0;border-radius:6px;background:var(--panel-2);
  font-family:var(--display);font-size:17px;letter-spacing:.06em;color:var(--muted);
  transition:background .12s,color .12s;
}
.team .pts button:hover{background:#2A3340;color:var(--fg)}
.team .pts .plus:hover{background:var(--c);color:#0E1116}

.team.dim{opacity:.22}
.team.buzzed{background:var(--c)}
.team.buzzed .head{background:rgba(0,0,0,.35)}
.team.buzzed .name,.team.buzzed .score{color:#0B0E12}
.team.buzzed .pts button{background:rgba(0,0,0,.22);color:rgba(11,14,18,.75)}
.team.buzzed .pts button:hover{background:rgba(0,0,0,.4);color:#0B0E12}
.team.buzzed::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
}
@media (prefers-reduced-motion:no-preference){
  .team.buzzed::after{animation:sweep .5s ease-out}
}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.clock{
  position:absolute;left:0;bottom:0;height:5px;width:100%;transform-origin:left;
  background:rgba(0,0,0,.45);transform:scaleX(0);
}
.team.timing .clock{transform:scaleX(1);transition:transform var(--secs) linear}

.verdict{
  flex:0 0 auto;display:none;gap:2px;padding:2px 0 0;background:var(--line);
}
.verdict.show{display:flex}
.verdict button{
  flex:1;padding:20px 0;font-family:var(--display);font-size:22px;letter-spacing:.1em;
  text-transform:uppercase;background:var(--panel);transition:background .12s
}
.verdict .yes{color:#8FE0A2}
.verdict .yes:hover{background:#1D3323}
.verdict .no{color:#F09A93}
.verdict .no:hover{background:#33201E}

.hints{
  flex:0 0 auto;padding:9px 16px;background:var(--panel);border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap
}
kbd{
  font-family:var(--display);font-size:12px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:4px;padding:2px 7px;color:var(--fg)
}
.mirror{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line);height:100vh}
.mtile{
  position:relative;background:var(--panel);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(10px,3vh,32px);
  overflow:hidden;transition:background .18s,opacity .18s;
}
.mtile .head{position:absolute;top:0;left:0;right:0;height:8px;background:var(--c)}
.mname{
  font-family:var(--display);font-size:clamp(13px,2.6vh,24px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--c);transition:color .18s;white-space:nowrap
}
.mscore{
  font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;
  font-size:clamp(52px,26vh,160px);line-height:.9;letter-spacing:-.02em
}
.mtile.dim{opacity:.22}
.mtile.buzzed{background:var(--c)}
.mtile.buzzed .head{background:rgba(0,0,0,.35)}
.mtile.buzzed .mname,.mtile.buzzed .mscore{color:#0B0E12}
.mtile.buzzed::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
}
@media (prefers-reduced-motion:no-preference){
  .mtile.buzzed::after{animation:sweep .5s ease-out}
}
@media (max-width:640px){
  .board{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Zukunftswerkstatt Klima · <b>Quizshow</b></div>
  <button class="btn" id="btn-serial"><span class="dot" id="dot"></span>Buzzer verbinden</button>
  <button class="btn on" id="btn-timer">Antwortzeit 10 s</button>
  <button class="btn" id="btn-pip">Publikumsansicht</button>
  <button class="btn" id="btn-full">Vollbild</button>
  <button class="btn" id="btn-zero">Punkte auf 0</button>
</header>

<main class="board" id="board"></main>

<div class="verdict" id="verdict">
  <button class="yes" id="btn-yes">Richtig · +1</button>
  <button class="no" id="btn-no">Falsch · andere frei</button>
</div>

<footer class="hints">
  <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> Buzzer simulieren</span>
  <span><kbd>Leertaste</kbd> freigeben</span>
  <span><kbd>Enter</kbd> richtig</span>
  <span><kbd>Backspace</kbd> falsch</span>
  <span>Teamname: doppelklicken</span>
</footer>

<script>
const COLORS = ['var(--t1)','var(--t2)','var(--t3)','var(--t4)'];
const TONES  = [392.0, 493.9, 587.3, 659.3];
const KEYMAP = {'Digit1':0,'Digit2':1,'Digit3':2,'Digit4':3,'F13':0,'F14':1,'F15':2,'F16':3};

const state = {
  names:  ['Team 1','Team 2','Team 3','Team 4'],
  scores: [0,0,0,0],
  locked: [false,false,false,false],
  active: null,
  timerOn: true
};

const SYNC_KEY = 'zwk-quiz-state';
let lastRemoteJSON = null;   // last state string we know is on the server (ours or someone else's)
let syncing = false;

// Push the current state to shared storage so other open screens pick it up.
async function save(){
  const payload = JSON.stringify({
    scores: state.scores, names: state.names,
    locked: state.locked, active: state.active, timerOn: state.timerOn
  });
  if(payload === lastRemoteJSON) return; // nothing changed, skip a write
  lastRemoteJSON = payload;
  try{
    await window.storage.set(SYNC_KEY, payload, true);
  }catch(e){ console.error('Sync-Speicherung fehlgeschlagen', e); }
}

// Pull the latest shared state and apply it if something changed elsewhere.
async function pull(){
  if(syncing) return;
  syncing = true;
  try{
    const result = await window.storage.get(SYNC_KEY, true);
    if(result && result.value && result.value !== lastRemoteJSON){
      lastRemoteJSON = result.value;
      const remote = JSON.parse(result.value);
      // Don't yank the input out from under someone mid-rename.
      if(document.activeElement && document.activeElement.isContentEditable){ syncing = false; return; }
      if(remote.scores && remote.scores.length === 4) state.scores = remote.scores;
      if(remote.names && remote.names.length === 4) state.names = remote.names;
      if(remote.locked && remote.locked.length === 4) state.locked = remote.locked;
      if('active' in remote) state.active = remote.active;
      if('timerOn' in remote) state.timerOn = remote.timerOn;
      render();
      document.getElementById('btn-timer').classList.toggle('on', state.timerOn);
    }
  }catch(e){ /* key not created yet, or a network hiccup — try again next tick */ }
  syncing = false;
}

// Initial load, then poll every second so all open screens stay in sync.
pull().then(render);
setInterval(pull, 1000);

const board = document.getElementById('board');
const verdict = document.getElementById('verdict');

state.names.forEach((n,i)=>{
  const el = document.createElement('section');
  el.className = 'team';
  el.style.setProperty('--c', COLORS[i]);
  el.innerHTML =
    '<div class="head"></div>'+
    '<div class="name" data-i="'+i+'">'+n+'</div>'+
    '<div class="score">0</div>'+
    '<div class="pts"><button class="minus" data-d="-1">−1</button>'+
    '<button class="plus" data-d="1">+1</button></div>'+
    '<div class="clock"></div>';
  el.querySelectorAll('.pts button').forEach(b=>{
    b.onclick = () => addPoint(i, +b.dataset.d);
  });
  el.querySelector('.name').ondblclick = e => renameTeam(i, e.target);
  board.appendChild(el);
});
const teams = [...board.children];

function render(){
  teams.forEach((el,i)=>{
    el.querySelector('.score').textContent = state.scores[i];
    el.querySelector('.name').textContent  = state.names[i];
    el.classList.toggle('buzzed', state.active === i);
    el.classList.toggle('dim', (state.active !== null && state.active !== i) || (state.active === null && state.locked[i]));
  });
  verdict.classList.toggle('show', state.active !== null);
  renderMirror();
}

function renderMirror(){
  if(!mirrorTiles.length) return;
  mirrorTiles.forEach((el,i)=>{
    el.querySelector('.mscore').textContent = state.scores[i];
    el.querySelector('.mname').textContent  = state.names[i];
    el.classList.toggle('buzzed', state.active === i);
    el.classList.toggle('dim', (state.active !== null && state.active !== i) || (state.active === null && state.locked[i]));
  });
}

function addPoint(i, d){
  state.scores[i] = Math.max(0, state.scores[i] + d);
  save(); render();
}

function renameTeam(i, el){
  el.contentEditable = 'true';
  el.focus();
  document.execCommand('selectAll', false, null);
  const finish = () => {
    el.contentEditable = 'false';
    const v = el.textContent.trim();
    state.names[i] = v || ('Team ' + (i+1));
    save(); render();
  };
  el.onblur = finish;
  el.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } };
}

let audio;
function beep(i){
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square'; o.frequency.value = TONES[i];
    g.gain.setValueAtTime(.0001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.18, audio.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + .32);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + .34);
  }catch(e){}
}

function buzz(i){
  if(state.active !== null || state.locked[i]) return;
  state.active = i;
  beep(i);
  render();
  save();
  const el = teams[i];
  if(state.timerOn){
    el.style.setProperty('--secs','10s');
    void el.offsetWidth;
    el.classList.add('timing');
  }
}

function release(){
  teams.forEach(el=>{ el.classList.remove('timing'); el.style.removeProperty('--secs'); });
  state.active = null;
  render();
  save();
  sendSerial('R\n');
}

function unlockAll(){
  state.locked = [false,false,false,false];
  release();
}

document.getElementById('btn-yes').onclick = () => {
  if(state.active === null) return;
  addPoint(state.active, 1);
  unlockAll();
};
document.getElementById('btn-no').onclick = () => {
  if(state.active === null) return;
  state.locked[state.active] = true;
  release();
};
document.getElementById('btn-zero').onclick = () => {
  state.scores = [0,0,0,0]; save(); unlockAll();
};
document.getElementById('btn-timer').onclick = e => {
  state.timerOn = !state.timerOn;
  e.currentTarget.classList.toggle('on', state.timerOn);
  save();
};
document.getElementById('btn-full').onclick = () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

addEventListener('keydown', e => {
  if(document.activeElement && document.activeElement.isContentEditable) return;
  if(e.code in KEYMAP){ e.preventDefault(); buzz(KEYMAP[e.code]); return; }
  if(e.code === 'Space'){ e.preventDefault(); unlockAll(); return; }
  if(e.code === 'Enter'){ e.preventDefault(); document.getElementById('btn-yes').click(); return; }
  if(e.code === 'Backspace'){ e.preventDefault(); document.getElementById('btn-no').click(); }
});

let writer = null;
const dot = document.getElementById('dot');
const btnSerial = document.getElementById('btn-serial');

if(!('serial' in navigator)){
  btnSerial.disabled = true;
  btnSerial.textContent = 'Buzzer: Chrome oder Edge nötig';
}

btnSerial.onclick = async () => {
  try{
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    writer = port.writable.getWriter();
    dot.classList.add('live');
    btnSerial.innerHTML = '<span class="dot live"></span>Buzzer verbunden';
    btnSerial.disabled = true;
    readLoop(port);
  }catch(err){
    btnSerial.innerHTML = '<span class="dot"></span>Verbindung fehlgeschlagen – nochmal';
  }
};

async function readLoop(port){
  const dec = new TextDecoderStream();
  port.readable.pipeTo(dec.writable);
  const reader = dec.readable.getReader();
  let buf = '';
  while(true){
    const { value, done } = await reader.read();
    if(done) break;
    buf += value;
    let nl;
    while((nl = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      const m = /^B([1-4])$/.exec(line);
      if(m) buzz(+m[1] - 1);
    }
  }
}

function sendSerial(txt){
  if(!writer) return;
  writer.write(new TextEncoder().encode(txt)).catch(()=>{});
}

let mirrorTiles = [];

document.getElementById('btn-pip').onclick = async () => {
  if(!('documentPictureInPicture' in window)){
    alert('Dieses Overlay braucht Chrome oder Edge ab Version 116.\n\nAlternative: PowerPoint unter "Bildschirmpräsentation einrichten" auf "Ansicht durch ein Publikum (Fenster)" stellen, dann liegt dieses Fenster darüber.');
    return;
  }
  const pip = await documentPictureInPicture.requestWindow({ width: 1100, height: 300 });
  for(const sheet of document.styleSheets){
    try{
      const css = [...sheet.cssRules].map(r => r.cssText).join('');
      const s = pip.document.createElement('style');
      s.textContent = css;
      pip.document.head.appendChild(s);
    }catch(e){}
  }
  const wrap = pip.document.createElement('div');
  wrap.className = 'mirror';
  state.names.forEach((n,i)=>{
    const tile = pip.document.createElement('div');
    tile.className = 'mtile';
    tile.style.setProperty('--c', COLORS[i]);
    tile.innerHTML = '<div class="head"></div><div class="mname"></div><div class="mscore">0</div>';
    wrap.appendChild(tile);
  });
  pip.document.body.appendChild(wrap);
  mirrorTiles = [...wrap.children];
  pip.addEventListener('pagehide', () => { mirrorTiles = []; });
  render();
};
</script>
</body>
</html>
